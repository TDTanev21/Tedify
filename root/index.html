
<!DOCTYPE html>
<html lang="bg">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Временно прекъсване — Tedify</title>
	<style>
		/* Full-screen background image */
		html,body{height:100%;margin:0;font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial}
		body{
			/* use a safe filename (no spaces) for hosted environments */
			background: url("map-eagle-loook.jpg") center/cover no-repeat fixed;
			display:flex;align-items:center;justify-content:center;color:#fff;
		}

		/* overlay to improve contrast */
		.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55)}

		/* Card */
		.card{
			position:relative;z-index:2;max-width:920px;width:92%;background:linear-gradient(180deg, rgba(255,255,255,0.04), rgba(0,0,0,0.2));border-radius:12px;padding:32px;box-shadow:0 10px 30px rgba(0,0,0,0.6);backdrop-filter: blur(6px);
			display:flex;gap:28px;align-items:center;flex-wrap:wrap;
		}

		.brand{
			display:flex;flex-direction:column;gap:8px;min-width:220px;
		}
		.logo{width:84px;height:84px;border-radius:12px;background:linear-gradient(135deg,#10b981,#06b6d4);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:28px;color:#06131a}

		h1{margin:0;font-size:26px;letter-spacing:0.2px}
		p.lead{margin:6px 0 0;color:#e6eef0;opacity:0.95}

		.actions{display:flex;gap:12px;align-items:center;margin-left:auto}
		.btn{appearance:none;border:0;padding:12px 20px;border-radius:999px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:10px}
		.btn-primary{background:#10b981;color:#041014;box-shadow:0 6px 18px rgba(16,185,129,0.18)}
		.btn-ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.08)}

		.note{width:100%;margin-top:14px;color:#cfeee0;font-size:14px;opacity:0.95}

		/* Responsive */
		@media (max-width:640px){
			.card{padding:20px;flex-direction:column;align-items:flex-start}
			.actions{width:100%;margin-left:0;justify-content:stretch}
			.btn{flex:1;justify-content:center}
			.brand{min-width:0}
			h1{font-size:20px}
		}
	</style>
</head>
<body>
	<div class="overlay" aria-hidden="true"></div>

	<main class="card" role="main" aria-labelledby="maintitle">
		<div class="brand">
			<div class="logo" aria-hidden="true">T</div>
			<div>
				<h1 id="maintitle">Временно прекъсване за поддръжка</h1>
				<p class="lead">Връщаме услугата онлайн възможно най-скоро. Благодарим за търпението.</p>
			</div>
		</div>

		<div style="flex:1;min-width:220px">
			<p class="note">Междувременно можеш да слушаш наличната музика от нашата страница. Някои функции може да са временно ограничени.</p>
		</div>

		<div class="actions" role="region" aria-label="Действия">
			<a id="listen-btn" class="btn btn-primary" href="./music.html">Слушай музика</a>
			<a class="btn btn-ghost" href="mailto:admin@tedify.local">За контакти</a>
		</div>
	</main>
</body>

	<script>
		// Ensure the Listen button navigates even in embedded previews
		(function(){
			const btn = document.getElementById('listen-btn');
			if (!btn) return;
			btn.addEventListener('click', function(e){
				e.preventDefault();
				// Resolve href against the current document base so hosted subpaths are handled
				const raw = btn.getAttribute('href') || 'music.html';
				const absolute = new URL(raw, document.baseURI).href;
				// try navigation
				try{ window.location.href = absolute; return; }catch(err){}
				try{ window.location.assign(absolute); return; }catch(err){}
				try{ window.open(absolute, '_self'); return; }catch(err){}
				// fallback: create and click a link
				const a = document.createElement('a'); a.href = absolute; a.target = '_self'; a.style.display='none'; document.body.appendChild(a); a.click();
			});
		})();
	</script>

	<script>
		// Background image fallback: try hyphenated filename first, then original with spaces.
		(function(){
			const tryUrls = [
				'map-eagle-loook.jpg',
				'map%20eagle%20loook.jpg',
				'map eagle loook.jpg'
			];

			function tryLoad(index){
				if (index >= tryUrls.length) return;
				// resolve relative to document base (handles subpaths on host)
				const rel = tryUrls[index];
				const url = new URL(rel, document.baseURI).href;
				const img = new Image();
				img.onload = () => { document.body.style.backgroundImage = `url("${url}")`; };
				img.onerror = () => tryLoad(index+1);
				img.src = url;
			}
			tryLoad(0);
		})();
	</script>

</html>
